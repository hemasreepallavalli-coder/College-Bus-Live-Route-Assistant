<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Panel</title>
</head>

<body>

  <button
    onclick="window.location.href='/harshitha/'"
    style="
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #1e3a8a;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    "
  >
    ← Back to Home
  </button>

  <div id="root"></div>

  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import Driver from "../src/Driver.jsx";

    createRoot(document.getElementById("root")).render(
      React.createElement(Driver)
    );
  </script>
</body>
</html>
